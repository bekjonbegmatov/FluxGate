services:
  haproxy:
    build:
      context: .
      dockerfile: haproxy/Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "443:443/tcp"
      - "9389:9389/tcp"
    volumes:
      - panel-data:/data
  panel:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/usr/local/bin/panel", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    network_mode: "service:haproxy"
    depends_on:
      - haproxy
    environment:
      PANEL_DATA: /data
      PANEL_WEB: /opt/panel/web
      PANEL_SECRET_PATH: ${PANEL_SECRET_PATH:-admin}
      PANEL_LISTEN: :9389
      PANEL_TOKEN: ${PANEL_TOKEN:?Set PANEL_TOKEN in .env}
      PANEL_MASTER_KEY: ${PANEL_MASTER_KEY:?Set PANEL_MASTER_KEY in .env}
      PANEL_TIMEZONE: ${PANEL_TIMEZONE:-UTC}
      PANEL_FLUSH_INTERVAL: ${PANEL_FLUSH_INTERVAL:-5s}
      PANEL_MAX_CONNECTIONS: ${PANEL_MAX_CONNECTIONS:-10000}
      PANEL_DOMAIN: ${PANEL_DOMAIN:?Set PANEL_DOMAIN in .env}
    volumes:
      - panel-data:/data
volumes:
  panel-data:
